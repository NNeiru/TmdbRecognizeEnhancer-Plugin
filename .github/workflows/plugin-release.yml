name: Plugin Release

on:
  push:
    branches:
      - main
    paths:
      - package.v2.json
      - plugins.v2/tmdbrecognizeenhancer/**
      - .github/workflows/plugin-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmdbrecognizeenhancer-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins.v2/tmdbrecognizeenhancer/package-lock.json

      - name: Validate current version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(jq -r '.TmdbRecognizeEnhancer.version' package.v2.json)"
          source_version="$(python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path('plugins.v2/tmdbrecognizeenhancer/__init__.py').read_text(encoding='utf-8'))
          for class_node in (node for node in tree.body if isinstance(node, ast.ClassDef)):
              for node in class_node.body:
                  if isinstance(node, ast.Assign) and any(
                      isinstance(target, ast.Name) and target.id == 'plugin_version'
                      for target in node.targets
                  ):
                      print(ast.literal_eval(node.value))
                      raise SystemExit
          raise SystemExit('plugin_version not found')
          PY
          )"
          frontend_version="$(jq -r '.version' plugins.v2/tmdbrecognizeenhancer/package.json)"
          test "$package_version" = "$source_version"
          test "$package_version" = "$frontend_version"
          test -f "plugins.v2/tmdbrecognizeenhancer/dist/ui/v${package_version}/assets/remoteEntry.js"
          jq -e --arg version "v${package_version}" \
            '.TmdbRecognizeEnhancer.history[$version] | type == "string" and length > 0' \
            package.v2.json >/dev/null

      - name: Build and verify frontend
        working-directory: plugins.v2/tmdbrecognizeenhancer
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Verify committed frontend is current
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(jq -r '.TmdbRecognizeEnhancer.version' package.v2.json)"
          dist_dir="plugins.v2/tmdbrecognizeenhancer/dist/ui/v${package_version}"
          test -f "${dist_dir}/assets/remoteEntry.js"
          if [ -n "$(git status --porcelain --untracked-files=all -- "${dist_dir}")" ]; then
            echo "::error::Committed frontend assets are stale. Run npm ci && npm run build, then commit the generated current-version dist."
            git status --short --untracked-files=all -- "${dist_dir}"
            git diff -- "${dist_dir}"
            exit 1
          fi

      - name: Create installable releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          plugin_id="TmdbRecognizeEnhancer"
          plugin_dir="plugins.v2/tmdbrecognizeenhancer"

          create_release() {
            local version="$1"
            local commit="$2"
            local notes="$3"
            local tag="${plugin_id}_v${version}"
            local asset="tmdbrecognizeenhancer_v${version}.zip"
            local stage

            git cat-file -e "${commit}^{commit}"
            rm -f "$asset"
            stage="$(mktemp -d)"
            git archive \
              --format=zip \
              --prefix=tmdbrecognizeenhancer/ \
              --output="${stage}/source.zip" \
              "${commit}:${plugin_dir}"
            unzip -q "${stage}/source.zip" -d "${stage}/package"

            # 每个版本的联邦入口都有独立目录。安装包只需要当前入口；
            # 历史目录留在 Git 中用于开发追溯，不再随每次更新重复下载。
            if [ -d "${stage}/package/tmdbrecognizeenhancer/dist/ui" ]; then
              find "${stage}/package/tmdbrecognizeenhancer/dist/ui" \
                -mindepth 1 -maxdepth 1 -type d \
                ! -name "v${version}" -exec rm -rf {} +
            fi
            (
              cd "${stage}/package"
              zip -qr "${GITHUB_WORKSPACE}/${asset}" tmdbrecognizeenhancer
            )
            rm -rf "$stage"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists, updating target and installable asset"
              gh release edit "$tag" \
                --target "$commit" \
                --title "$tag" \
                --notes "$notes"
              gh release upload "$tag" "$asset" --clobber
              return
            fi

            gh release create "$tag" "$asset" \
              --target "$commit" \
              --title "$tag" \
              --notes "$notes"
          }

          current_version="$(jq -r '.TmdbRecognizeEnhancer.version' package.v2.json)"
          current_notes="$(jq -r --arg version "v${current_version}" '.TmdbRecognizeEnhancer.history[$version] // "Automated plugin release"' package.v2.json)"
          create_release "$current_version" "$GITHUB_SHA" "$current_notes"
